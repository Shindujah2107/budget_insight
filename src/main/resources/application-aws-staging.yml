# ============================================================
# AWS Staging — budget-insights (ECS Fargate / shared RDS PostgreSQL)  [Mumbai / ap-south-1]
#
# Deployment target
#   ECS cluster : moipay-staging-cluster  (ap-south-1)
#   ECR image   : 331064632826.dkr.ecr.ap-south-1.amazonaws.com/moipay-staging/budget-insights
#   ALB routes  : /insights/*
#
# Secrets Manager injection (via ECS task definition)
#   [SM:rds]  moipay-staging-budget-insights/rds/credentials
#             keys injected: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#                            SPRING_DATASOURCE_PASSWORD
#   [SM:app]  moipay-staging-budget-insights/app/credentials
#             keys injected: BUDGET_INSIGHTS_ADMIN_USERNAME, BUDGET_INSIGHTS_ADMIN_PASSWORD,
#                            GATEWAY_INTERNAL_TOKEN
#                            BI_FORMAT_USER_HASH_KEY (SMS format discovery, Phase 2)
#
# Other env-var sources
#   [ECS-ENV] plain environment variable on the ECS task definition
#   [YML]     default value defined in this file
# ============================================================

spring:
  application:
    name: moipay-budget-insights

  # ── RDS PostgreSQL (shared moipay-staging instance, dedicated database) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL}              # [SM:rds]  jdbc:postgresql://host:5432/moipay_budget_insights
    username: ${SPRING_DATASOURCE_USERNAME}    # [SM:rds]
    password: ${SPRING_DATASOURCE_PASSWORD}    # [SM:rds]
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5                     # conservative — RDS t3.micro max_connections ≈ 113
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      connection-init-sql: SET search_path TO budget_insights, public

  # Tables live in their own budget_insights schema (isolated from the backend's
  # moipay_core schema on the same shared instance). Idempotent on every boot.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-budget-insights.sql

  jpa:
    hibernate:
      ddl-auto: none                # Flyway owns the schema now (was: update)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: budget_insights
        format_sql: false

  # ── Flyway migrations ────────────────────────────────────────────────────
  # Staging's DB is provisioned fresh, so V1.0.0 creates the schema and
  # V1.0.1 seeds the minimum dataset on first boot.
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    schemas: budget_insights
    default-schema: budget_insights
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1.0.0}
    # Defaults FALSE here, unlike dev. Staging rehearses the production promotion, and a
    # migration that lands out of sequence on the rehearsal proves nothing about the real
    # one. Safe to flip today: the migrations run V1.0.0 -> V1.1.0 strictly ascending and
    # budget-insights has no staging deployment yet, so there is no history to conflict
    # with. Override per deployment if a genuine out-of-order case ever arises.
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}
    validate-migration-naming: ${SPRING_FLYWAY_VALIDATE_MIGRATION_NAMING:false}
    locations: classpath:db/migration/common
    # V1.5.1 builds indexes CONCURRENTLY outside a transaction; that waits for every open
    # transaction, including one Flyway would otherwise hold for its lock.
    postgresql:
      transactional-lock: ${SPRING_FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK:false}

  h2:
    console:
      enabled: false

  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework          # honour X-Forwarded-* headers from the ALB
  servlet:
    context-path: /insights
  tomcat:
    connection-timeout: 20000

# ── API docs ──────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    # Defaults FALSE on staging. Dev keeps it on because the frontend and mobile teams
    # integrate against it there; staging rehearses the production promotion, and a
    # promotion checklist item that has to be remembered is one that eventually is not.
    # Set SWAGGER_ENABLED=true on the task definition when it is genuinely needed.
    enabled: ${SWAGGER_ENABLED:false}          # [ECS-ENV]
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    # Served at /insights/v3/api-docs/openapi so it falls under the API Gateway's public
    # "GET /insights/v3/api-docs/{proxy+}" route — mirrors the case-engine/dev fix.
    path: /v3/api-docs/openapi

# ── Actuator (ECS health-check target: GET /insights/actuator/health) ───────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# ── MoiPay budget-insights settings ──────────────────────────────────────────────
moipay:
  budget-insights:
    admin:
      username: ${BUDGET_INSIGHTS_ADMIN_USERNAME}   # [SM:app]  — no default, must be injected
      password: ${BUDGET_INSIGHTS_ADMIN_PASSWORD}   # [SM:app]  — no default, must be injected
    # ── Budget Insights feature switches ───────────────────────────────────
    # The feature ships dark. lookback-months is a Compliance position, not a tuning
    # knob: raising it widens how much personal financial history is processed, so it
    # is deliberately visible here rather than buried in a query.
    enabled: ${BUDGET_INSIGHTS_ENABLED:false}                 # [ECS-ENV]
    lookback-months: ${BUDGET_INSIGHTS_LOOKBACK_MONTHS:6}     # [YML]
    currency: ${BUDGET_INSIGHTS_CURRENCY:LKR}                 # [YML]
    default-category-alert-threshold-pct: 80                  # [YML] fallback only: live value is bi_budget_policy (Admin › Budget Policy)
    masked-card-to-backend-enabled: ${BUDGET_INSIGHTS_MASKED_CARD_ENABLED:false}   # [ECS-ENV] change only with Compliance sign-off
    device-hash-salt: ${BUDGET_INSIGHTS_DEVICE_HASH_SALT:}    # [SM:app]
    # Day counts on the budget ring are worked out in this zone, not the container's UTC.
    zone: ${BUDGET_INSIGHTS_ZONE:Asia/Colombo}                # [YML]
    pace-tolerance-pct: ${BUDGET_INSIGHTS_PACE_TOLERANCE_PCT:0}   # [YML]
    manual:
      # R1 release gate: entry by hand. Off, the three write routes answer 501 and reads
      # are untouched.
      enabled: ${BUDGET_INSIGHTS_MANUAL_ENABLED:false}        # [ECS-ENV]
    budget:
      # Per-release gate beneath `enabled`. R2: monthly target, summary ring and the
      # set-a-budget screen. Off, the summary answers 501 as it did before R2 existed,
      # so the release can be withdrawn without taking the whole Insights tab away.
      enabled: ${BUDGET_INSIGHTS_BUDGET_ENABLED:false}        # [ECS-ENV]
    consent:
      # R3 release gate: consent grant/read/withdrawal, and the export and erasure
      # routes beneath it. Compliance gate 1 must pass before this is enabled in any
      # environment that can reach real customer data.
      enabled: ${BUDGET_INSIGHTS_CONSENT_ENABLED:false}       # [ECS-ENV]
      # The policy version in force. Must match the text the app displays.
      version: ${BUDGET_INSIGHTS_CONSENT_VERSION:1.0}         # [YML]

    ingest:
      # R4 release gate: POST /messages/ingest and GET /reference/sync. Compliance gate 2 must
      # pass -- the OTP leakage test green for every supported bank format -- before this is
      # enabled anywhere that can reach real customer messages.
      enabled: ${BUDGET_INSIGHTS_INGEST_ENABLED:false}          # [ECS-ENV]
      # The batch is one transaction; this bounds the unit of work, not the customer.
      max-batch-size: ${BUDGET_INSIGHTS_INGEST_MAX_BATCH:200}   # [YML]
      # Per device, per window. Approximate across tasks -- see IngestRateLimiter.
      rate-limit-messages: ${BUDGET_INSIGHTS_INGEST_RATE:600}   # [YML]
      rate-limit-window-seconds: 60                             # [YML]
      # Empty accepts any well-formed type. Narrow once D-3 is answered.
      accepted-message-types: []                                # [YML]
    format-discovery:
      # SMS format discovery (V1.13.0). Both phases ship OFF. Phase 1 (enabled) takes daily counts
      # of unreadable bank SMS per sender; Phase 2 (samples-enabled) takes message skeletons and
      # needs Compliance sign-off, the consent wording that covers it (raise consent.version with
      # it) and BI_FORMAT_USER_HASH_KEY. Without the key Phase 2 answers 501 and the device holds
      # its queue. NEVER rotate the key while samples exist: withdrawal and erasure find a
      # customer's samples by recomputing the HMAC with it.
      enabled: ${BUDGET_INSIGHTS_FORMAT_DISCOVERY_ENABLED:false}            # [ECS-ENV]
      samples-enabled: ${BUDGET_INSIGHTS_FORMAT_SAMPLES_ENABLED:false}      # [ECS-ENV] Compliance sign-off first
      user-hash-key: ${BI_FORMAT_USER_HASH_KEY:}                            # [SM:app] 32+ chars, never rotate
    activity:
      # R5 release gate: GET /activity. No compliance gate, but the card series stays empty until
      # masked-card-to-backend-enabled is approved, because the tail is dropped on arrival and the
      # transaction is recorded against no account.
      enabled: ${BUDGET_INSIGHTS_ACTIVITY_ENABLED:false}        # [ECS-ENV]
    alerts:
      # R6 release gate: threshold alerts are recorded and served. In-app only; this
      # service has no notifier and sends nothing externally.
      enabled: ${BUDGET_INSIGHTS_ALERTS_ENABLED:false}          # [ECS-ENV]
    recommendations:
      # R6: 50/30/20 guidance. Shares of the monthly target, not of income.
      # The percentages, trailing-months and the bucket lists below are FALLBACKS only. The live
      # values are edited in the Admin Dashboard (Budget Policy tab, and the bucket on each
      # category) and stored in bi_budget_policy / bi_category.spend_bucket. They are used only if
      # that row is missing or no category has a bucket.
      enabled: ${BUDGET_INSIGHTS_RECOMMENDATIONS_ENABLED:false} # [ECS-ENV]
      needs-pct: 50                                             # [YML]
      wants-pct: 30                                             # [YML]
      savings-pct: 20                                           # [YML]
      trailing-months: 3                                        # [YML]
      # The 50/30/20 mapping approved 20 September 2026 -- also the V1.8.0 backfill of
      # bi_category.spend_bucket.
      #
      # OTHER and TRANSFERS are deliberately in NO list. OTHER is what the categoriser falls back
      # to when it cannot tell, and bucketing it would distort every percentage with spend nobody
      # has classified. A TRANSFERS row might be saving, supporting family, or moving money between
      # the customer's own accounts -- this service cannot see which, and guessing would be worse
      # than reporting it separately. Both are returned under `unbucketed` so the parts still sum
      # to the whole.
      needs:
        - BILLS_UTILITIES
        - UTILITIES
        - TRANSPORT
        - HEALTH_CARE
        - EDUCATION
        - WORK
      wants:
        - DINING_OUT
        - ENTERTAINMENT
        - SHOPPING
        - SUBSCRIPTIONS
        - TRAVEL
        - GIFTS_DONATION
        - GYM
        - PERSONAL_CARE
      savings:
        - DEBT_PAYMENTS
    stub:
      # Fixture data. InsightsStubModeGuard refuses to start if this is true on any
      # profile outside local / test / aws-dev / aws-staging.
      enabled: ${BUDGET_INSIGHTS_STUB_ENABLED:false}          # [ECS-ENV]

    # BI-27 export retention. The only thing limiting how long a second copy of a customer's
    # whole history exists, so it is an env var rather than a constant: shortening it must not
    # need a release.
    export:
      retention-hours: ${BUDGET_INSIGHTS_EXPORT_RETENTION_HOURS:24}   # [ECS-ENV]

    # BI-29 / BI-30 scheduled jobs. Not beneath the master feature flag -- retention does not
    # pause because the screen is switched off.
    jobs:
      enabled: ${BUDGET_INSIGHTS_JOBS_ENABLED:true}                   # [ECS-ENV]
      retention-cron: "${BUDGET_INSIGHTS_RETENTION_CRON:0 15 2 * * *}"  # [YML]
      refresh-cron: "${BUDGET_INSIGHTS_REFRESH_CRON:0 45 2 * * *}"      # [YML]

    security:
      gateway-auth-enabled: true
      gateway-internal-token: ${GATEWAY_INTERNAL_TOKEN}  # [SM:app]

  # Reject API-Gateway requests that bypass CloudFront/WAF (CloudFront injects
  # X-Origin-Verify). enforce=false is log-only; flip via ORIGIN_VERIFY_ENFORCE.
  #
  # This block was ABSENT from the staging profile, while dev has carried it since R0. The
  # Terraform microservice module injects ORIGIN_VERIFY_ENABLED, ORIGIN_VERIFY_ENFORCE and
  # ORIGIN_VERIFY_SECRET into every task, but OriginVerifyFilter reads Spring properties, not
  # environment variables -- so with no wiring here those three were set on the task and read
  # by nobody, and origin verification was off in staging whatever the infrastructure said.
  security:
    origin-verify:
      enabled: ${ORIGIN_VERIFY_ENABLED:false}             # [YML]
      enforce: ${ORIGIN_VERIFY_ENFORCE:false}             # [YML]
      secret: ${ORIGIN_VERIFY_SECRET:}                    # [YML]

# ── Logging → stdout → ECS awslogs driver → CloudWatch ───────────────────────
logging:
  level:
    com.moipay.budgetinsights: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
