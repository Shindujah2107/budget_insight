# MoneyReserve backend — settings shared by every profile.
#
# Secrets and machine-specific values come from environment variables. The `local` profile
# (application-local.yml) supplies development defaults for them and runs
# against a local PostgreSQL database (scripts/create-local-db.sh creates it).

spring:
  application:
    name: moneyreserve-api

  # PostgreSQL. Tables live in the budget_insights schema, created and migrated by Flyway;
  # currentSchema puts it on the connection's search path.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moneyreserve?currentSchema=budget_insights}
    username: ${DB_USERNAME:moneyreserve}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Flyway owns the schema; Hibernate never changes it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    schemas: budget_insights
    default-schema: budget_insights
    locations: classpath:db/migration/common
    # V1.5.1 builds indexes CONCURRENTLY, which cannot run while Flyway holds a transactional lock.
    postgresql:
      transactional-lock: false
    # V1.5.1 carries a .conf file beside it; naming validation would reject that.
    validate-migration-naming: false

server:
  port: ${PORT:8087}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

moneyreserve:
  # Browser origins allowed to call the API (Expo web). The phone app is a native client and is
  # not affected by CORS.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8090,http://localhost:19006}

  insights:
    # Every app feature is on. Each flag still exists in code (a switched-off feature answers 404
    # or 501), so one can be turned off here without a release.
    enabled: true
    lookback-months: 6
    currency: LKR
    zone: Asia/Colombo
    default-category-alert-threshold-pct: 80
    pace-tolerance-pct: 0
    # Last 3–4 digits of a card or account found in a bank SMS.
    masked-card-to-backend-enabled: true
    # Salt for hashing device ids on the compliance route. Blank switches that route off (501).
    device-hash-salt: ${DEVICE_HASH_SALT:}

    manual:
      enabled: true
    budget:
      enabled: true
    consent:
      enabled: true
      # Raising this asks every customer to accept the SMS consent again.
      version: "1.0"
    ingest:
      enabled: true
      max-batch-size: 200
      rate-limit-messages: 600
      rate-limit-window-seconds: 60
      accepted-message-types: []
    activity:
      enabled: true
    alerts:
      enabled: true
    compliance:
      max-batch-size: 200
      rate-limit-messages: 600
      rate-limit-window-seconds: 60
      clock-skew-minutes: 10
    # 50/30/20 split of the customer's monthly target. OTHER and TRANSFERS are deliberately in no
    # bucket and come back as `unbucketed`.
    recommendations:
      enabled: true
      needs-pct: 50
      wants-pct: 30
      savings-pct: 20
      trailing-months: 3
      needs: [BILLS_UTILITIES, UTILITIES, TRANSPORT, HEALTH_CARE, EDUCATION, WORK]
      wants: [DINING_OUT, ENTERTAINMENT, SHOPPING, SUBSCRIPTIONS, TRAVEL, GIFTS_DONATION, GYM, PERSONAL_CARE]
      savings: [DEBT_PAYMENTS]
    # Fixture data instead of the database. Never on outside local/test.
    stub:
      enabled: false
    # Learning unknown bank SMS formats. Off: needs a hashing key and its own consent wording.
    format-discovery:
      enabled: false
      samples-enabled: false
      min-distinct-users: 5
      sample-ttl-days: 90
      stat-retention-days: 90
      max-stats-per-request: 100
      max-samples-per-request: 20
      max-samples-per-user-per-day: 50
      user-hash-key: ${FORMAT_USER_HASH_KEY:}
    # How long a generated data export stays downloadable.
    export:
      retention-hours: 24
    # Nightly retention and aggregate-refresh jobs.
    jobs:
      enabled: true
      retention-cron: "0 15 2 * * *"
      refresh-cron: "0 45 2 * * *"



  # App sign-in: mobile number + SMS code, then JWTs issued by this service.
  auth:
    enabled: true
    # HS256 signing key, at least 32 bytes. Required; changing it signs everyone out.
    jwt-secret: ${BI_JWT_SECRET:}
    issuer: moneyreserve-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp:
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-interval: 30s
      max-sends-per-hour: 10
    # Mobile numbers that get the SUPER_ADMIN role (the admin API) when they sign in.
    super-admin-phones: ${SUPER_ADMIN_PHONES:}
    sms:
      # log: codes are written to the log, not sent (local/test only). textlk: real SMS via Text.lk.
      provider: ${SMS_PROVIDER:log}
      text-lk:
        base-url: ${TEXTLK_BASE_URL:https://app.text.lk/api/v3}
        api-token: ${TEXTLK_API_TOKEN:}
        sender-id: ${TEXTLK_SENDER_ID:}
        timeout: 10s

logging:
  level:
    com.moneyreserve: INFO
