# Local development on this Mac: run with -Dspring-boot.run.profiles=local
#
# Uses the local PostgreSQL database `moneyreserve` (one-time setup: scripts/create-local-db.sh). No SMS is
# sent: each sign-in code is a fresh random 6-digit code, printed in this terminal. AuthDevModeGuard
# refuses to start with the log-only SMS sender on any other profile.

spring:
  datasource:
    password: ${DB_PASSWORD:moneyreserve}

moneyreserve:
  # Expo web and the admin dashboard (moneyreserve_admin, port 8095) on this Mac.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8090,http://localhost:19006,http://localhost:8095}

  insights:
    # Development-only values; never use them anywhere real.
    device-hash-salt: ${DEVICE_HASH_SALT:local-dev-salt-not-a-secret}
    # A purge firing while you debug is noise, not signal.
    jobs:
      enabled: false
    # SMS format discovery on, and one phone is enough to see a candidate in the admin dashboard
    # (FormatDiscoveryLocalGuard refuses that floor outside local/test).
    format-discovery:
      enabled: true
      samples-enabled: true
      local-min-distinct-users: 1
      user-hash-key: ${FORMAT_USER_HASH_KEY:local-dev-format-hash-key-not-a-secret}

  auth:
    jwt-secret: ${BI_JWT_SECRET:local-dev-jwt-secret-not-for-any-real-environment}
    # Signs in as SUPER_ADMIN locally, to try the admin API. Put your own number in
    # .env.local (SUPER_ADMIN_PHONES=+9477…); scripts/run-local.sh reads it and git ignores it.
    super-admin-phones: ${SUPER_ADMIN_PHONES:+94770000000}

logging:
  level:
    com.moneyreserve: DEBUG
